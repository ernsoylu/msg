[package]
name = "crypto-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
rsa = { version = "0.9", default-features = false, features = ["sha2", "std", "pem"] }
getrandom = { version = "0.2", features = ["js"] }
rand_core = "0.6"
base64 = "0.22"
